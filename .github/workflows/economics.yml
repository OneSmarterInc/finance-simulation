name: Economics checks

on:
  push:
    paths: ["economics/**", ".github/workflows/economics.yml"]
  pull_request:
    paths: ["economics/**", ".github/workflows/economics.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixtures are up to date
        run: python3 economics/build.py --check
      - name: Named checks
        run: python3 economics/check.py
